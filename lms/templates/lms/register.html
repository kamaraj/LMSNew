{% load static %}
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Daftar Akaun Baharu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url("{% static 'image/login.jpg' %}");
      background-size: cover;
      background-position: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .form-container {
      width: 600px;
      margin: 60px auto;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
      color: #333;
    }
    .form-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .submit-btn {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }
    .bottom-text {
      text-align: center;
      margin-top: 15px;
    }
    .bottom-text a {
      color: #007bff;
      text-decoration: none;
    }
    .bottom-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Daftar Akaun Baharu</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label for="staff_id">Staff ID:</label>
          <input type="text" name="staff_id" required>
          <label for="jabatan">Jabatan:</label>
          <input type="text" name="jabatan" required>
          <label for="login_id">Login ID:</label>
          <input type="text" name="login_id" required>
          <label for="email">Email:</label>
          <input type="email" name="email" required>
          <label for="password2">Sahkan Kata Laluan:</label>
          <input type="password" name="password2" required>
        </div>
        <div class="form-group">
          <label for="nama">Nama Penuh:</label>
          <input type="text" name="nama" required>
          <label for="jawatan">Jawatan:</label>
          <input type="text" name="jawatan" required>
          <label for="username">Username:</label>
          <input type="text" name="username" required>
          <label for="password1">Kata Laluan:</label>
          <input type="password" name="password1" required>
        </div>
      </div>
      <button type="submit" class="submit-btn">✨ Daftar Akaun</button>
    </form>
    <div class="bottom-text">
      Sudah ada akaun? <a href="{% url 'login' %}">Log Masuk</a>
    </div>
  </div>
</body>
</html>
