<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Pautan Reset Dihantar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #007bff, #00c6ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirmation-box {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .confirmation-box h2 {
      color: #007bff;
      font-size: 26px;
      margin-bottom: 15px;
    }

    .confirmation-box p {
      color: #333;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 600px) {
      .confirmation-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="confirmation-box">
    <h2>Pautan Reset Telah Dihantar</h2>
    <p>Sila semak emel anda untuk menetapkan semula kata laluan anda.</p>

    <div class="footer-text">

</html>
