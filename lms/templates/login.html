{% load static %}
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Log Masuk ke ELITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url("{% static 'image/login.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            background: #fff;
            padding: 25px 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-radius: 12px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .extra-links {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        .extra-links a {
            color: #007bff;
            text-decoration: none;
        }

        .messages {
            text-align: center;
            margin-bottom: 10px;
            color: red;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Log Masuk ke Dashboard</h2>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
        {% endif %}
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <label for="username">User ID</label>
            <input type="text" name="username" required placeholder="Masukkan ID Pengguna">
            <label for="password">Password</label>
            <input type="password" name="password" required placeholder="Masukkan Kata Laluan">
            <div style="margin-bottom: 10px;">
                <input type="checkbox" name="remember"> Ingat saya
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="extra-links">
            <p><a href="{% url 'password_reset' %}">Lupa kata laluan?</a></p>
            <p>Belum ada akaun? <a href="{% url 'register' %}">Daftar di sini</a></p>
        </div>
    </div>
</body>
</html>
